benchmarks:
  - benchmark_name: "add"
    trace_dir: "../data/vpu-microbench/add"
    csv_path: "../data/vpu-microbench/add"
    xlml_metrics_dir: "../data/vpu-microbench/add"
    xla_dump_dir: "../data/vpu-microbench/add/hlo_graphs"
    num_runs: 100
    benchmark_sweep_params:
      - { m: 2048, n: 7168 }
      - { m: 4096, n: 8192 }
      - { m: 128, n: 7168 }
      - { m: 2048, n: 8192 }
      - { m: 512, n: 7168 }
      - { m: 256, n: 16384 }
      - { m: 1024, n: 16384 }
      - { m: 4096, n: 16384 }
      - { m: 256, n: 8192 }
      - { m: 2048, n: 16384 }
      - {
          m_range: { start: 1024, end: 8192, multiplier: 2 },
          n: "SAME_AS_m", # n will be set to the same value as m
          num_runs: 100,
        }
