    trace_dir: "../data/vpu-binray/sub"
    xlml_metrics_dir: "../data/vpu-binray/sub"
    csv_path: "../data/vpu-binray/sub"
    xla_dump_dir: "../data/vpu-binray/sub/hlo_graphs"

