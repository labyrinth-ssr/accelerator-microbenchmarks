benchmarks:
  # Example 1: Sweep matrix sizes for add operation
  - benchmark_name: "add"
    num_runs: 100
    benchmark_sweep_params:
      - {
          m_range: { start: 1024, end: 8192, multiplier: 2 },
          n: "SAME_AS_m", # n will be set to the same value as m
        }
    trace_dir: "../data/vpu-binray/add"
    xlml_metrics_dir: "../data/vpu-binray/add"
    csv_path: "../data/vpu-binray/add"
    xla_dump_dir: "../data/vpu-binray/add/hlo_graphs"

  - benchmark_name: "sub"
    num_runs: 100
    benchmark_sweep_params:
      - {
          m_range: { start: 1024, end: 8192, multiplier: 2 },
          n: "SAME_AS_m", # n will be set to the same value as m
