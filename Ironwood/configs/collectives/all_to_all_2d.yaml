benchmarks:
  - benchmark_name: all_to_all
    benchmark_sweep_params:
      - {
          matrix_dim_range: { start: 2, end: 8192, multiplier: 2 },
          dtype: "float32",
          mesh_shape: "4x32",
          ici_size_range: 128,
          sharding_strategy: "1x32",
          op_dimension: 2,
          num_runs: 5,
        } # Non Parallel Replica
    trace_dir: "../data/microbenchmarks/all_to_all_2d"
    csv_path: "../data/microbenchmarks/all_to_all_2d"
    xlml_metrics_dir: "../data/microbenchmarks/all_to_all_2d"
    xla_dump_dir: "../data/microbenchmarks/all_to_all_2d/hlo_graphs"
