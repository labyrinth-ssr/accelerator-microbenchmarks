# Unary operations - Exponentials and logarithms
- benchmark_name: "exp"
  num_runs: 100
  benchmark_sweep_params:
    - { m_range: { start: 1024, end: 8192, multiplier: 2 }, n: "SAME_AS_m" }
  trace_dir: "../data/vpu-unary/exp"
  xlml_metrics_dir: "../data/vpu-unary/exp"
  csv_path: "../data/vpu-unary/exp"
  xla_dump_dir: "../data/vpu-unary/exp/hlo_graphs"

